# Publishes the site to GitHub Pages ONLY after the smoke test passes.
# The smoke test opens the site in demo mode (sample data, nothing touches Firebase)
# in a real browser at phone size, visits every page as a guest and as the owner,
# opens every form, and fails on any script error or anything missing.
#
# One-time setting: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Check and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["functions/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the scripts parse
        run: node --check app.js && node --check store.js && node --check config.js
      - name: Install a test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Run the smoke test
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.cjs http://localhost:8765/

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # proves to Pages that this run is from this repo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the site files
        run: |
          mkdir _site
          cp index.html app.js store.js config.js *.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
