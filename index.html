<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Merritt's Closet</title>
<meta name="theme-color" content="#EBD6D3" />
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Beige ground, dusty rose primary, sage accents. One light look on every
     device, including phones set to dark mode. */
  :root {
    --paper: #F6F0E7; --surface: #FFFCF8; --blush: #EBD6D3; --blush-2: #DDBDB9;
    --rose: #9E5D63; --rose-lt: #F4E6E4; --cocoa: #8E5A60; --hazel: #D8C7B1;
    --taupe: #857B77; --moss: #5F7A5E; --moss-lt: #E2EADD; --ink: #463E3F;
    --line: #E7DDD3; --dot: rgba(255,255,255,.75); --stripe: rgba(255,255,255,.35);
    --shadow: 0 1px 2px rgba(70,62,63,.06), 0 4px 14px rgba(70,62,63,.06); --on-rose: #FFFFFF; color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 16px/1.45 Nunito, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--rose); }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-variation-settings: "SOFT" 100; margin: 0; }

  /* Header: pink with fine vertical stripes and white dots, like the wallpaper */
  .hero {
    background:
      radial-gradient(circle, var(--dot) 1.6px, transparent 2.2px) 0 0 / 22px 22px,
      repeating-linear-gradient(90deg, var(--stripe) 0 2px, transparent 2px 14px),
      var(--blush);
    padding: calc(28px + env(safe-area-inset-top)) 16px 22px;
    text-align: center;
  }
  .hero h1 { font-size: 34px; font-weight: 650; color: var(--ink); letter-spacing: -.01em; }
  .hero p { margin: 4px 0 0; color: var(--taupe); font-size: 14px; font-weight: 600; }
  .hero svg { display: block; margin: 0 auto 6px; }

  .tabs {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 4px; justify-content: center;
    background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 8px 16px;
  }
  .tab { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--taupe); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--blush); color: var(--rose); }

  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 120px; }
  .note { background: var(--moss-lt); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 26px 0 10px; }
  .section-title h2 { font-size: 21px; font-weight: 600; }
  .muted { color: var(--taupe); font-size: 14px; }
  .empty { text-align: center; color: var(--taupe); padding: 40px 12px; }

  /* Wishlist cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; margin-bottom: 12px; position: relative; }
  .card.claimed { opacity: .72; }
  .thumb { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: var(--blush); display: block; }
  .card h3 { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .meta { font-size: 13.5px; color: var(--taupe); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--rose-lt); color: var(--rose); white-space: nowrap; }
  .chip.ink { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .chip.moss { background: var(--moss-lt); color: var(--moss); }
  .chip.tan { background: color-mix(in srgb, var(--hazel) 45%, transparent); color: var(--ink); }
  .ribbon { position: absolute; top: -8px; left: 14px; background: var(--rose); color: var(--on-rose); font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px dashed var(--line); padding-top: 10px; }
  .actions .spacer { flex: 1; }

  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 800; cursor: pointer; background: var(--rose); color: var(--on-rose); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.soft { background: var(--moss-lt); color: var(--moss); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .link { background: none; border: 0; color: var(--rose); font-weight: 700; cursor: pointer; padding: 6px 4px; text-decoration: none; font-size: 14px; }
  .status { font-weight: 800; font-size: 14px; color: var(--moss); }
  .status.taken { color: var(--taupe); }

  /* Closet */
  .brand-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px 0 10px; }
  .brand-head h2 { font-size: 20px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .print { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding: 0; text-align: left; cursor: default; }
  .print.editable { cursor: pointer; }
  .print img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--blush); }
  .print span { display: block; padding: 7px 8px 9px; font-size: 13px; font-weight: 700; line-height: 1.25; }
  .search { position: relative; margin: 0 0 12px; }
  .search svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: none; stroke: var(--taupe); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .search .in { padding-left: 40px; border-radius: 999px; }
  .search input::-webkit-search-cancel-button { filter: grayscale(1); opacity: .6; cursor: pointer; }
  .result-count { margin: 0 0 4px; font-size: 13.5px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .filter { border: 1.5px solid var(--line); background: var(--surface); color: var(--taupe); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .filter span { font-weight: 700; opacity: .7; margin-left: 2px; }
  .filter[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: var(--on-rose); }
  .print small { display: block; font-size: 12px; font-weight: 600; color: var(--taupe); margin-top: 1px; }
  .seg + .seg { margin-top: -6px; }
  .favs { background: var(--rose-lt); border: 1px solid var(--blush-2); border-radius: 18px; padding: 14px 14px 6px; margin: 0 0 18px; }
  .favs-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .favs-head h2 { font-size: 19px; font-weight: 600; color: var(--rose); }
  .favs > .muted { margin: 4px 0 8px; }
  .empty-favs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding-bottom: 12px; }
  .empty-favs b { width: 100%; color: var(--rose); }
  .fav-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--blush-2); }
  .fav-row > div { min-width: 0; }
  .fav-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: var(--blush); }
  .fav-style { flex: none; min-width: 52px; text-align: center; font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 999px; background: var(--moss); color: var(--on-rose); }
  .fav-line { font-size: 14px; color: var(--ink); margin-top: 2px; }
  .admin-card { background: var(--surface); border: 1.5px dashed var(--blush-2); border-radius: 18px; padding: 16px; margin-bottom: 18px; display: grid; gap: 8px; justify-items: start; }
  .admin-card p { margin: 0; }
  .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .link.manage { font-size: 13px; padding: 12px 2px 4px; }
  .modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(40,32,32,.42); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--paper); border-radius: 20px; padding: 18px 16px 16px; width: 100%; max-width: 420px; max-height: 86vh; overflow: auto; box-shadow: 0 12px 40px rgba(40,32,32,.25); }
  .modal h3 { font-size: 20px; margin-bottom: 4px; }
  .modal p { margin: 0 0 10px; }
  .type-list { display: grid; gap: 2px; margin: 6px 0 12px; }
  .type-row { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .type-row span { flex: 1; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .type-row.editing .in { flex: 1; padding: 8px 10px; }
  .add-row { display: flex; gap: 8px; } .add-row .in { flex: 1; min-width: 0; }
  .danger-btn { background: #A8423A; color: #fff; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; font-weight: 700; }
  .pill { font-style: normal; font-size: 10.5px; letter-spacing: .02em; padding: 2px 7px; border-radius: 999px; background: var(--moss-lt); color: var(--moss); }
  .type-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .type-opt { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .type-opt[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: var(--on-rose); }
  .card-body { min-width: 0; }
  .link.quiet { color: var(--taupe); font-weight: 600; }
  button:focus-visible, a:focus-visible, .in:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

  /* Sizes */
  .size-row { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .size-row .name { flex: 1; min-width: 0; }
  .size-row .name strong { display: block; font-size: 16.5px; }
  .size-badge { font-family: Fraunces, serif; font-size: 22px; font-weight: 650; color: var(--cocoa); text-align: right; white-space: nowrap; }
  .size-badge small { display: block; font-family: Nunito, sans-serif; font-size: 11.5px; font-weight: 700; color: var(--taupe); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--taupe); width: 64px; text-align: center; }
  .swatch i { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); display: block; }

  /* Floating add button + footer */
  .fab { position: fixed; right: max(16px, calc(50vw - 344px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; box-shadow: 0 6px 20px rgba(166,90,94,.35); padding: 14px 20px; font-size: 16px; }
  footer { text-align: center; padding: 30px 16px 40px; }

  /* Bottom sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(40,28,24,.38); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
  .sheet h2 { font-size: 22px; margin-bottom: 12px; }
  .seg { display: flex; background: var(--blush); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 8px; font-weight: 800; color: var(--taupe); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  label.f { display: block; font-size: 13px; font-weight: 800; color: var(--taupe); margin: 12px 0 4px; }
  .in { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
  .in:focus { outline: 2px solid var(--blush-2); border-color: var(--rose); }
  textarea.in { resize: vertical; min-height: 120px; font-size: 14px; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 700; font-size: 15px; }
  .check input { width: 20px; height: 20px; accent-color: var(--rose); }
  .import { display: flex; gap: 8px; } .import .in { flex: 1; }
  .preview { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .preview img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--blush); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
  .sheet-actions .spacer { flex: 1; }
  .danger { color: #B3423A; }
  .err { color: #B3423A; font-size: 14px; font-weight: 700; margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 30; box-shadow: var(--shadow); width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  .demo-bar { background: var(--moss-lt); color: var(--moss); text-align: center; font-size: 13px; font-weight: 800; padding: 6px; }
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
